<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{title}}</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e6f7ff;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: #008c95;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo i {
            margin-right: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .main {
            width: 90%;
            max-width: 950px;
            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            color: #17324d;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .section-title {
            color: #008c95;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .user-type {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .type-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .type-card:hover {
            border-color: #008c95;
            background: #f2fcff;
        }

        .type-card i {
            display: block;
            font-size: 30px;
            color: #008c95;
            margin-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #008c95;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            top: 14px;
            color: #777;
        }

        .input-box input {
            padding-left: 42px;
        }

        .password-info {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .terms {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .terms input {
            width: auto;
        }

        .terms a {
            color: #008c95;
            text-decoration: none;
            font-weight: bold;
        }

        .create-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #008c95;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:hover {
            background: #006f76;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #ddd;
            flex: 1;
        }

        .social {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .social i {
            margin-right: 10px;
            font-size: 18px;
        }

        .google {
            background: white;
            color: #333;
            border: 1px solid #ccc;
        }

        .google:hover {
            background: #f5f5f5;
        }

        .facebook {
            background: #1877f2;
            color: white;
            border: none;
        }

        .facebook:hover {
            background: #0d65d3;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .login-link a {
            color: #008c95;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            .user-type {
                flex-direction: column;
            }

            .register-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-stethoscope"></i>
        MedCare
    </div>

    <nav>
        <a href="/"><i class="fa-solid fa-house"></i> Home</a>
        <a href="#"><i class="fa-solid fa-calendar-check"></i> Appointment</a>
        <a href="#"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
    </nav>
</header>

<main class="main">

    <div class="title">
        <h1>Create Your Account</h1>
        <p>Join MedCare and manage your healthcare easily</p>
    </div>

    <div class="register-card">

        <h2 class="section-title">
            <i class="fa-solid fa-user-plus"></i>
            Account Type
        </h2>

        <div class="user-type">

            <label class="type-card">
                <i class="fa-solid fa-user"></i>
                <input type="radio" name="account" value="patient" checked onchange="changeAccountType()">
                Patient
            </label>

            <label class="type-card">
                <i class="fa-solid fa-user-doctor"></i>
                <input type="radio" name="account" value="doctor" onchange="changeAccountType()">
                Doctor
            </label>

        </div>

        <form method="POST" action="/register">

            <h2 class="section-title">
                <i class="fa-solid fa-id-card"></i>
                Personal Information
            </h2>

            <div class="form-grid">

                <div class="form-group full">
                    <label for="fullname">Full Name</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullname" name="name" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                    </div>
                </div>

                <div id="patient-fields" class="form-group full">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" name="date_of_birth">
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <select name="gender">
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="form-group full">
                            <label>Address</label>
                            <input type="text" name="address" placeholder="Enter your address">
                        </div>

                    </div>

                </div>

                <div id="doctor-fields" class="form-group full" style="display:none;">
                    <label>Specialization</label>
                    <input type="text" name="specialization" placeholder="e.g. Cardiologist">
                </div>

            </div>

            <h2 class="section-title">
                <i class="fa-solid fa-lock"></i>
                Account Security
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" minlength="6" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirm_password" required>
                    </div>
                </div>

            </div>

            <label class="terms">
                <input type="checkbox" name="terms" required>
                I agree to the <a href="#">Terms & Conditions</a>
            </label>

            <button type="submit" class="create-btn">
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </button>

        </form>

    </div>

</main>

<footer>
    © 2026 MedCare Doctor Appointment System | All Rights Reserved
</footer>

<script>
function changeAccountType() {
    const selectedAccount = document.querySelector('input[name="account"]:checked').value;

    document.getElementById("patient-fields").style.display =
        selectedAccount === "patient" ? "block" : "none";

    document.getElementById("doctor-fields").style.display =
        selectedAccount === "doctor" ? "block" : "none";
}
</script>

</body>
</html>
```
