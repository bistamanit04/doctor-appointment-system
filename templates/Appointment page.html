<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - MedCare</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5f9;
            color: #333;
        }

        /* Header */

        header {
            background: #008c95;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo i {
            margin-right: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* Main */

        .main {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #17324d;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #777;
        }


        /* Appointment Card */

        .appointment-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }


        /* Section Title */

        .section-title {
            color: #008c95;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }


        /* Form Grid */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }


        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #008c95;
        }


        textarea {
            resize: vertical;
            min-height: 100px;
        }


        /* Doctor Card */

        .doctor-info {
            display: flex;
            align-items: center;
            gap: 15px;

            background: #f5fafb;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        .doctor-icon {
            width: 60px;
            height: 60px;

            border-radius: 50%;

            background: #008c95;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
        }

        .doctor-info h3 {
            color: #17324d;
            margin-bottom: 5px;
        }

        .doctor-info p {
            color: #777;
            font-size: 14px;
        }


        /* Appointment Type */

        .appointment-type {
            display: flex;
            gap: 15px;
        }

        .type-option {
            flex: 1;
            border: 1px solid #ccc;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .type-option:hover {
            border-color: #008c95;
            background: #f5fafb;
        }

        .type-option i {
            display: block;
            color: #008c95;
            font-size: 22px;
            margin-bottom: 7px;
        }


        /* Buttons */

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .book-btn {
            background: #008c95;
            color: white;
        }

        .book-btn:hover {
            background: #006f76;
        }

        .reset-btn {
            background: #eee;
            color: #333;
        }

        .reset-btn:hover {
            background: #ddd;
        }


        /* Footer */

        footer {
            text-align: center;
            color: #777;
            padding: 20px;
            margin-top: 20px;
        }


        /* Mobile */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            .appointment-type {
                flex-direction: column;
            }

            .buttons {
                flex-direction: column;
            }

            .appointment-card {
                padding: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            <i class="fa-solid fa-stethoscope"></i>
            MedCare
        </div>

        <nav>
            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Home
            </a>

            <a href="appointment.html">
                <i class="fa-solid fa-calendar-check"></i>
                Appointment
            </a>

            <a href="#">
                <i class="fa-solid fa-user"></i>
                Profile
            </a>

            <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </nav>

    </header>


    <!-- MAIN -->

    <main class="main">

        <div class="title">

            <h1>Book an Appointment</h1>

            <p>
                Schedule an appointment with your preferred doctor
            </p>

        </div>


        <div class="appointment-card">


            <!-- PATIENT INFORMATION -->

            <h2 class="section-title">
                <i class="fa-solid fa-user"></i>
                Patient Information
            </h2>


            <form>


                <div class="form-grid">


                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            min="1"
                            max="120"
                            placeholder="Enter your age">

                    </div>

                </div>


                <br><br>


                <!-- DOCTOR INFORMATION -->

                <h2 class="section-title">
                    <i class="fa-solid fa-user-doctor"></i>
                    Doctor Information
                </h2>


                <div class="form-grid">


                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select id="department" required>

                            <option value="">
                                Select Department
                            </option>

                            <option>
                                Cardiology
                            </option>

                            <option>
                                Dermatology
                            </option>

                            <option>
                                Neurology
                            </option>

                            <option>
                                Orthopedics
                            </option>

                            <option>
                                Pediatrics
                            </option>

                            <option>
                                General Medicine
                            </option>

                            <option>
                                Dentistry
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="doctor">
                            Select Doctor
                        </label>

                        <select id="doctor" required>

                            <option value="">
                                Select Doctor
                            </option>

                            <option>
                                Dr. John Smith - Cardiologist
                            </option>

                            <option>
                                Dr. Sarah Wilson - Dermatologist
                            </option>

                            <option>
                                Dr. Michael Brown - Neurologist
                            </option>

                            <option>
                                Dr. Emily Davis - Pediatrician
                            </option>

                            <option>
                                Dr. Robert Taylor - Orthopedic
                            </option>

                        </select>

                    </div>

                </div>


                <br><br>


                <!-- APPOINTMENT DETAILS -->

                <h2 class="section-title">
                    <i class="fa-solid fa-calendar-days"></i>
                    Appointment Details
                </h2>


                <div class="form-grid">


                    <div class="form-group">

                        <label for="date">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="time">
                            Preferred Time
                        </label>

                        <select id="time" required>

                            <option value="">
                                Select Time
                            </option>

                            <option>
                                09:00 AM - 10:00 AM
                            </option>

                            <option>
                                10:00 AM - 11:00 AM
                            </option>

                            <option>
                                11:00 AM - 12:00 PM
                            </option>

                            <option>
                                01:00 PM - 02:00 PM
                            </option>

                            <option>
                                02:00 PM - 03:00 PM
                            </option>

                            <option>
                                03:00 PM - 04:00 PM
                            </option>

                            <option>
                                04:00 PM - 05:00 PM
                            </option>

                        </select>

                    </div>


                    <!-- Appointment Type -->

                    <div class="form-group full">

                        <label>
                            Appointment Type
                        </label>

                        <div class="appointment-type">


                            <label class="type-option">

                                <input
                                    type="radio"
                                    name="type"
                                    value="in-person"
                                    required>

                                <i class="fa-solid fa-hospital"></i>

                                In-Person

                            </label>


                            <label class="type-option">

                                <input
                                    type="radio"
                                    name="type"
                                    value="online">

                                <i class="fa-solid fa-video"></i>

                                Online Consultation

                            </label>

                        </div>

                    </div>


                    <!-- Reason -->

                    <div class="form-group full">

                        <label for="reason">
                            Reason for Visit
                        </label>

                        <textarea
                            id="reason"
                            placeholder="Briefly describe your symptoms or reason for appointment..."
                            required></textarea>

                    </div>


                    <!-- Message -->

                    <div class="form-group full">

                        <label for="message">
                            Additional Message
                        </label>

                        <textarea
                            id="message"
                            placeholder="Any additional information for the doctor..."></textarea>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn book-btn">

                        <i class="fa-solid fa-calendar-check"></i>

                        Book Appointment

                    </button>


                    <button
                        type="reset"
                        class="btn reset-btn">

                        <i class="fa-solid fa-rotate-left"></i>

                        Reset

                    </button>

                </div>


            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 MedCare Doctor Appointment System
        | All Rights Reserved

    </footer>


</body>
</html>
